<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TOWER OF BABEL</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #000;
}
.wrap {
  height: 100vh;
  height: 100dvh;
  position: relative;
}
canvas#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  user-select: none;
}
</style>
<div class="wrap" id="wrap">
  <canvas id="gameCanvas"></canvas>
</div>
<script>
(function () {
  const PIXEL = 4;
  const FONT = '"Courier New", monospace';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const buf = document.createElement('canvas');
  const bctx = buf.getContext('2d');

  let W = 0, H = 0, BW = 0, BH = 0;
  let screen = 'title';

  // ---------------- stars ----------------
  const STAR_COUNT = 70;
  const stars = Array.from({ length: STAR_COUNT }, () => ({
    fx: Math.random(),
    fy: Math.random() * 0.55,
    phase: Math.random() * Math.PI * 2,
  }));

  // ---------------- title screen state ----------------
  let titleItems = [];
  let exitAnim = null;

  function layoutTitle() {
    bctx.font = `bold 10px ${FONT}`;
    const titleSize = fitFontSize(['TOWER OF BABEL'], BW * 0.6, BH * 0.16, 1, 'bold');
    const menuLabels = ['START', 'OPTIONS', 'EXIT'];
    const menuSize = Math.max(6, Math.round(BH * 0.06));
    bctx.font = `bold ${menuSize}px ${FONT}`;
    const startY = BH * 0.56;
    const gap = menuSize * 2.1;
    titleItems = menuLabels.map((label, i) => {
      const w = bctx.measureText(label).width;
      return {
        label,
        cx: BW / 2,
        cy: startY + i * gap,
        w,
        h: menuSize,
        fontSize: menuSize,
      };
    });
    titleFontSize = titleSize;
  }
  let titleFontSize = 10;

  function fitFontSize(lines, maxW, maxH, lineHeightFactor, weight) {
    let lo = 4, hi = Math.max(4, Math.floor(maxH));
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      bctx.font = `${weight} ${mid}px ${FONT}`;
      let maxLineW = 0;
      for (const l of lines) maxLineW = Math.max(maxLineW, bctx.measureText(l).width);
      const totalH = lines.length * mid * lineHeightFactor;
      if (maxLineW <= maxW && totalH <= maxH) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  function drawScene(night, now) {
    bctx.fillStyle = night ? '#05070f' : '#4fa8e0';
    bctx.fillRect(0, 0, BW, BH);

    if (night) {
      const t = now / 500;
      for (const s of stars) {
        const alpha = 0.4 + 0.5 * Math.max(0, Math.sin(t + s.phase));
        bctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
        bctx.fillRect(Math.floor(s.fx * BW), Math.floor(s.fy * BH), 1, 1);
      }
      bctx.fillStyle = '#eef0d8';
      bctx.beginPath();
      bctx.arc(BW * 0.88, BH * 0.1, Math.max(3, BH * 0.045), 0, Math.PI * 2);
      bctx.fill();
    } else {
      bctx.fillStyle = '#fff2a8';
      bctx.beginPath();
      bctx.arc(BW * 0.88, BH * 0.1, Math.max(3, BH * 0.05), 0, Math.PI * 2);
      bctx.fill();
    }

    const baseY = BH * 0.78;
    const peakX = BW * 0.5, peakY = BH * 0.28;
    bctx.fillStyle = night ? '#151a24' : '#5b4a3f';
    bctx.beginPath();
    bctx.moveTo(0, baseY);
    bctx.lineTo(BW * 0.18, BH * 0.55);
    bctx.lineTo(BW * 0.32, BH * 0.68);
    bctx.lineTo(peakX, peakY);
    bctx.lineTo(BW * 0.66, BH * 0.6);
    bctx.lineTo(BW * 0.82, BH * 0.5);
    bctx.lineTo(BW, baseY);
    bctx.closePath();
    bctx.fill();

    drawTower(peakX, peakY, night, now);

    bctx.fillStyle = night ? '#0a1830' : '#2f7bb0';
    bctx.fillRect(0, baseY, BW, BH - baseY);
    const shimmerX = Math.floor(BW * 0.88);
    for (let y = baseY; y < BH; y += 2) {
      if (Math.random() > 0.5) {
        const w = 1 + Math.floor(Math.random() * 3);
        bctx.fillStyle = night ? 'rgba(220,230,255,0.5)' : 'rgba(255,255,220,0.6)';
        bctx.fillRect(shimmerX - (w >> 1) + (Math.floor(Math.random() * 3) - 1), y, w, 1);
      }
    }
  }

  function drawTower(cx, baseY, night, now) {
    const tiers = 5;
    const tierH = Math.max(2, Math.round(BH * 0.022));
    const maxW = Math.max(8, Math.round(BW * 0.1));
    const blockColor = night ? '#2a2620' : '#8a7355';
    const edgeColor = night ? '#161310' : '#5b4a35';
    for (let i = 0; i < tiers; i++) {
      const w = maxW * (1 - i / tiers) + 3;
      const y = baseY - (i + 1) * tierH;
      bctx.fillStyle = blockColor;
      bctx.fillRect(Math.round(cx - w / 2), Math.round(y), Math.round(w), tierH - 1);
      bctx.fillStyle = edgeColor;
      bctx.fillRect(Math.round(cx - w / 2), Math.round(y), 1, tierH - 1);
      bctx.fillRect(Math.round(cx + w / 2 - 1), Math.round(y), 1, tierH - 1);
    }
    const topY = baseY - tiers * tierH;
    bctx.fillStyle = night ? '#3a3020' : '#6b5a40';
    bctx.fillRect(Math.round(cx - 1), topY - 6, 1, 6);
    bctx.fillRect(Math.round(cx - 4), topY - 6, 8, 1);

    const bob = Math.floor(now / 400) % 2;
    const workerColor = night ? '#c9c2b0' : '#3a2a1a';
    const positions = [
      [cx - maxW * 0.3, baseY - tierH * 1],
      [cx + maxW * 0.22, baseY - tierH * 3],
      [cx - maxW * 0.08, baseY - tierH * 4.6],
    ];
    for (const [wx, wy] of positions) {
      bctx.fillStyle = workerColor;
      bctx.fillRect(Math.round(wx), Math.round(wy - bob), 1, 1);
    }
  }

  function drawTitle(now) {
    drawScene(true, now);
    if (exitAnim) updateExitAnim(now);
  }

  function drawTitleTextHiRes(now) {
    const S = PIXEL;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.font = `bold ${titleFontSize * S}px ${FONT}`;
    ctx.fillStyle = '#e8c86a';
    ctx.fillText('TOWER OF BABEL', (BW / 2) * S, (BH * 0.14) * S);

    for (const item of titleItems) {
      if (item.label === 'EXIT' && exitAnim) continue;
      ctx.font = `bold ${item.fontSize * S}px ${FONT}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(item.label, item.cx * S, item.cy * S);
    }

    if (exitAnim && exitAnim.phase === 'falling') {
      ctx.font = `bold ${exitAnim.fontSize * S}px ${FONT}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('EXIT', exitAnim.x * S, exitAnim.y * S);
    }
  }

  function startExitFall() {
    const item = titleItems.find((i) => i.label === 'EXIT');
    exitAnim = {
      phase: 'falling',
      x: item.cx,
      y: item.cy,
      vy: 0,
      fontSize: item.fontSize,
      shards: [],
      shatterAt: 0,
    };
  }

  function updateExitAnim(now) {
    if (exitAnim.phase === 'falling') {
      exitAnim.vy += 0.35;
      exitAnim.y += exitAnim.vy;
      if (exitAnim.y >= BH - 4) {
        exitAnim.y = BH - 4;
        exitAnim.phase = 'shattered';
        exitAnim.shatterAt = now;
        const shardCount = 18;
        for (let i = 0; i < shardCount; i++) {
          const angle = Math.random() * Math.PI - Math.PI / 2 - Math.PI / 2;
          const speed = 0.6 + Math.random() * 1.8;
          exitAnim.shards.push({
            x: exitAnim.x + (Math.random() - 0.5) * exitAnim.fontSize * 2,
            y: exitAnim.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.5,
            size: 1 + Math.random() * 2,
            rot: Math.random() * Math.PI,
          });
        }
      }
    } else if (exitAnim.phase === 'shattered') {
      const age = now - exitAnim.shatterAt;
      const alpha = Math.max(0, 1 - age / 900);
      for (const s of exitAnim.shards) {
        s.vy += 0.25;
        s.x += s.vx;
        s.y += s.vy;
        if (s.y > BH) { s.y = BH; s.vy *= -0.3; }
        bctx.fillStyle = `rgba(223,243,255,${alpha.toFixed(2)})`;
        bctx.fillRect(Math.round(s.x), Math.round(s.y), Math.ceil(s.size), Math.ceil(s.size));
      }
      if (age > 3000) exitAnim = null;
    }
  }

  function hitTitle(bx, by) {
    for (const item of titleItems) {
      if (item.label === 'EXIT' && exitAnim) continue;
      const pad = 2;
      if (bx >= item.cx - item.w / 2 - pad && bx <= item.cx + item.w / 2 + pad &&
        by >= item.cy - item.h / 2 - pad && by <= item.cy + item.h / 2 + pad) {
        if (item.label === 'START') screen = 'map';
        else if (item.label === 'OPTIONS') screen = 'options';
        else if (item.label === 'EXIT') startExitFall();
        return;
      }
    }
  }

  // ---------------- options screen ----------------
  const OPTIONS_LINES = [
    'YOU ALWAYS HAVE OPTIONS',
    'YOU CAN ALWAYS CHOOSE',
    'YOU CAN CHANGE THINGS',
    'BEFORE ITS TOO LATE',
  ];
  let optionsFontSize = 10, optionsLineHeight = 12, backItem = null;

  function layoutOptions() {
    optionsFontSize = fitFontSize(OPTIONS_LINES, BW * 0.9, BH * 0.7, 1.15, 'bold');
    optionsLineHeight = optionsFontSize * 1.15;
    const backSize = Math.max(5, Math.round(BH * 0.045));
    bctx.font = `bold ${backSize}px ${FONT}`;
    backItem = {
      label: 'BACK',
      cx: BW / 2,
      cy: BH * 0.92,
      w: bctx.measureText('BACK').width,
      h: backSize,
      fontSize: backSize,
    };
  }

  function drawOptions() {
    bctx.fillStyle = '#000000';
    bctx.fillRect(0, 0, BW, BH);
  }

  function drawOptionsTextHiRes() {
    const S = PIXEL;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${optionsFontSize * S}px ${FONT}`;
    ctx.fillStyle = '#ffffff';
    const startY = (BH / 2 - ((OPTIONS_LINES.length - 1) * optionsLineHeight) / 2) * S;
    OPTIONS_LINES.forEach((line, i) => {
      ctx.fillText(line, (BW / 2) * S, startY + i * optionsLineHeight * S);
    });
    ctx.font = `bold ${backItem.fontSize * S}px ${FONT}`;
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText(backItem.label, backItem.cx * S, backItem.cy * S);
  }

  function hitOptions(bx, by) {
    const pad = 3;
    if (bx >= backItem.cx - backItem.w / 2 - pad && bx <= backItem.cx + backItem.w / 2 + pad &&
      by >= backItem.cy - backItem.h / 2 - pad && by <= backItem.cy + backItem.h / 2 + pad) {
      screen = 'title';
    }
  }

  // ---------------- map screen ----------------
  let nodes = {};
  let player = { x: 0, y: 0, atNode: 'start', walking: false, walkFrom: null, walkTo: null, walkStart: 0, walkDur: 1200, phase: 0 };

  function layoutMap() {
    nodes = {
      start: { x: BW * 0.14, y: BH * 0.82, label: 'START', selectable: false },
      library: { x: BW * 0.36, y: BH * 0.6, label: 'LIBRARY', selectable: true },
    };
    if (!player.walking) {
      const n = nodes[player.atNode];
      player.x = n.x;
      player.y = n.y;
    }
  }

  function updatePlayer(now) {
    if (!player.walking) return;
    const t = Math.min(1, (now - player.walkStart) / player.walkDur);
    const from = player.walkFrom, to = player.walkTo;
    const midX = (from.x + to.x) / 2;
    const midY = Math.min(from.y, to.y) - Math.abs(to.x - from.x) * 0.15;
    const a = lerp2(from, { x: midX, y: midY }, t);
    const b = lerp2({ x: midX, y: midY }, to, t);
    player.x = lerp(a.x, b.x, t);
    player.y = lerp(a.y, b.y, t);
    player.phase = Math.floor(now / 150) % 2;
    if (t >= 1) {
      player.walking = false;
      player.atNode = 'library';
      player.x = to.x;
      player.y = to.y;
    }
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function lerp2(p1, p2, t) { return { x: lerp(p1.x, p2.x, t), y: lerp(p1.y, p2.y, t) }; }

  function drawLibraryBuilding(cx, baseY, now) {
    const pulse = 0.5 + 0.3 * Math.sin(now / 300);
    const glowR = Math.max(4, BH * 0.032);
    bctx.fillStyle = `rgba(255,220,90,${(pulse * 0.5).toFixed(2)})`;
    bctx.beginPath();
    bctx.arc(cx, baseY - glowR * 0.3, glowR, 0, Math.PI * 2);
    bctx.fill();

    const w = Math.max(6, Math.round(BH * 0.06));
    const h = Math.max(5, Math.round(BH * 0.05));
    const roofH = Math.round(h * 0.4);
    const bodyH = h - roofH;
    const bodyY = baseY - bodyH;
    const roofY = bodyY - roofH;

    bctx.fillStyle = '#d8c9a0';
    bctx.fillRect(Math.round(cx - w / 2), Math.round(bodyY), w, bodyH);
    bctx.fillStyle = '#a89468';
    const colCount = 3;
    for (let i = 0; i < colCount; i++) {
      const colX = Math.round(cx - w / 2 + (i + 0.5) * (w / colCount));
      bctx.fillRect(colX, Math.round(bodyY), 1, bodyH);
    }
    bctx.fillStyle = '#e8c86a';
    bctx.beginPath();
    bctx.moveTo(cx - w / 2 - 1, bodyY);
    bctx.lineTo(cx, roofY);
    bctx.lineTo(cx + w / 2 + 1, bodyY);
    bctx.closePath();
    bctx.fill();
  }

  function drawMap(now) {
    drawScene(false, now);

    bctx.strokeStyle = 'rgba(255,255,255,0.5)';
    bctx.lineWidth = 1;
    bctx.setLineDash([2, 2]);
    bctx.beginPath();
    bctx.moveTo(nodes.start.x, nodes.start.y);
    bctx.lineTo(nodes.library.x, nodes.library.y);
    bctx.stroke();
    bctx.setLineDash([]);

    bctx.fillStyle = '#888888';
    bctx.beginPath();
    bctx.arc(nodes.start.x, nodes.start.y, Math.max(2, BH * 0.015), 0, Math.PI * 2);
    bctx.fill();

    drawLibraryBuilding(nodes.library.x, nodes.library.y, now);

    drawPlayer();
  }

  function drawMapTextHiRes() {
    const S = PIXEL;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const labelSize = Math.max(5, Math.round(BH * 0.035));
    ctx.font = `bold ${labelSize * S}px ${FONT}`;

    ctx.fillStyle = '#cccccc';
    ctx.fillText(nodes.start.label, nodes.start.x * S, (nodes.start.y + labelSize * 1.4) * S);

    ctx.fillStyle = '#ffdc5a';
    ctx.fillText(nodes.library.label, nodes.library.x * S, (nodes.library.y - labelSize * 1.6) * S);
  }

  function drawPlayer() {
    const h = Math.max(4, Math.round(BH * 0.045));
    const w = Math.max(3, Math.round(h * 0.6));
    const x = Math.round(player.x - w / 2);
    const y = Math.round(player.y - h);
    bctx.fillStyle = '#f0e8d8';
    bctx.fillRect(x, y, w, Math.max(1, Math.round(h * 0.35)));
    bctx.fillStyle = '#c0392b';
    bctx.fillRect(x, y + Math.round(h * 0.35), w, Math.max(1, Math.round(h * 0.4)));
    const legOff = player.walking ? (player.phase ? 1 : -1) : 0;
    bctx.fillStyle = '#3a3a3a';
    bctx.fillRect(x + legOff, y + Math.round(h * 0.75), Math.max(1, Math.round(w * 0.4)), Math.round(h * 0.25));
    bctx.fillRect(x + w - Math.round(w * 0.4) - legOff, y + Math.round(h * 0.75), Math.max(1, Math.round(w * 0.4)), Math.round(h * 0.25));
  }

  function hitMap(bx, by) {
    if (player.walking) return;
    const n = nodes.library;
    const r = Math.max(4, BH * 0.03);
    if (Math.hypot(bx - n.x, by - n.y) <= r) {
      if (player.atNode === 'library') {
        enterLibrary();
        screen = 'library';
      } else {
        player.walking = true;
        player.walkFrom = { x: player.x, y: player.y };
        player.walkTo = { x: n.x, y: n.y };
        player.walkStart = performance.now();
      }
    }
  }

  // ---------------- library screen: Metroid-style vertical shaft ----------------
  let libWallT = 20, libFloorSpacing = 40, libGapW = 20, libDoorBandH = 400;
  let libPlayerH = 10, libPlayerW = 6;
  let libPlayer = null, libCameraY = 0, libReading = false, libBookLines = [];
  const libKeys = { left: false, right: false };
  const libTouch = { left: false, right: false };
  let bitcoinCount = 0;
  const collectedCoinFloors = new Set();

  function hash1(n) {
    const x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  function layoutLibrary() {
    libWallT = Math.max(6, Math.round(BW * 0.1));
    libFloorSpacing = Math.max(24, Math.round(BH * 0.22));
    libGapW = Math.max(14, Math.round((BW - 2 * libWallT) * 0.38));
    libDoorBandH = BH * 3;
    libPlayerH = Math.max(6, Math.round(BH * 0.06));
    libPlayerW = Math.max(4, Math.round(libPlayerH * 0.6));
  }

  function doorFloorIndexForBand(i) {
    const floorsPerBand = Math.max(1, Math.round(libDoorBandH / libFloorSpacing));
    const h = hash1(i * 5.171 + 3.3);
    const offset = Math.floor(floorsPerBand * 0.2) + Math.floor(h * floorsPerBand * 0.6);
    return i * floorsPerBand + offset;
  }

  function isDoorFloor(k) {
    const i = Math.floor((k * libFloorSpacing) / libDoorBandH);
    for (let d = -1; d <= 1; d++) {
      if (doorFloorIndexForBand(i + d) === k) return true;
    }
    return false;
  }

  function floorGap(k) {
    const innerLeft = libWallT, innerRight = BW - libWallT;
    const usableW = Math.max(0, innerRight - innerLeft - libGapW);
    if (k === 0) return { gapX: innerLeft, gapW: libGapW };
    if (isDoorFloor(k)) return { gapX: innerRight - libGapW, gapW: libGapW };
    const h = hash1(k * 12.9898);
    return { gapX: innerLeft + h * usableW, gapW: libGapW };
  }

  function inGap(k, x) {
    const { gapX, gapW } = floorGap(k);
    return x >= gapX && x <= gapX + gapW;
  }

  function coinForFloor(k) {
    if (k === 0 || isDoorFloor(k)) return null;
    const hExists = hash1(k * 8.233 + 4.71);
    if (hExists > 0.4) return null;
    const innerLeft = libWallT, innerRight = BW - libWallT;
    const { gapX, gapW } = floorGap(k);
    const leftSpan = gapX - innerLeft;
    const rightSpan = innerRight - (gapX + gapW);
    const hSide = hash1(k * 3.71 + 9.1);
    let x;
    if (leftSpan > rightSpan) x = innerLeft + hSide * Math.max(1, leftSpan);
    else x = gapX + gapW + hSide * Math.max(1, rightSpan);
    return { x, y: k * libFloorSpacing - Math.max(3, Math.round(libPlayerH * 0.4)) };
  }

  function doorYForBand(i) {
    return doorFloorIndexForBand(i) * libFloorSpacing;
  }

  function nearestDoorY(worldY) {
    const i = Math.floor(worldY / libDoorBandH);
    let best = null, bestDist = Infinity;
    for (let d = -1; d <= 1; d++) {
      const y = doorYForBand(i + d);
      const dist = Math.abs(y - worldY);
      if (dist < bestDist) { bestDist = dist; best = y; }
    }
    return best;
  }

  function generateBookText() {
    const lines = [];
    for (let i = 0; i < 7; i++) {
      const wc = 3 + Math.floor(Math.random() * 3);
      const words = [];
      for (let w = 0; w < wc; w++) {
        const len = 2 + Math.floor(Math.random() * 7);
        let word = '';
        for (let c = 0; c < len; c++) word += String.fromCharCode(97 + Math.floor(Math.random() * 26));
        words.push(word);
      }
      lines.push(words.join(' '));
    }
    return lines;
  }

  function enterLibrary() {
    layoutLibrary();
    libPlayer = { x: BW / 2, y: 0, vx: 0, vy: 0, onGround: true, facing: 1, phase: 0 };
    libCameraY = 0;
    libKeys.left = false;
    libKeys.right = false;
    libTouch.left = false;
    libTouch.right = false;
    libReading = false;
    libBookLines = [];
  }

  function libNearWall() {
    const innerLeft = libWallT, innerRight = BW - libWallT;
    const halfW = libPlayerW / 2;
    return (libPlayer.x - halfW <= innerLeft + 3) || (libPlayer.x + halfW >= innerRight - 3);
  }

  function tryReadBook() {
    if (libNearWall() && libPlayer.onGround) {
      libReading = true;
      libBookLines = generateBookText();
      return true;
    }
    return false;
  }

  function tryJump() {
    if (libPlayer.onGround) {
      libPlayer.vy = -2.8;
      libPlayer.onGround = false;
    }
  }

  function updateLibraryPhysics(now) {
    if (libReading) return;
    const innerLeft = libWallT, innerRight = BW - libWallT;
    const halfW = libPlayerW / 2;

    let vx = 0;
    if (libKeys.left || libTouch.left) vx -= 1.15;
    if (libKeys.right || libTouch.right) vx += 1.15;
    if (vx !== 0) libPlayer.facing = vx > 0 ? 1 : -1;
    libPlayer.phase = vx !== 0 ? Math.floor(now / 150) % 2 : 0;
    libPlayer.x = Math.max(innerLeft + halfW, Math.min(innerRight - halfW, libPlayer.x + vx));

    libPlayer.vy = Math.min(libPlayer.vy + 0.07, 2.2);
    let newY = libPlayer.y + libPlayer.vy;
    const dir = Math.sign(libPlayer.vy);
    if (dir > 0) {
      const k = Math.floor(newY / libFloorSpacing);
      const floorY = k * libFloorSpacing;
      if (floorY > libPlayer.y - 0.01 && floorY <= newY && !inGap(k, libPlayer.x)) {
        newY = floorY;
        libPlayer.vy = 0;
        libPlayer.onGround = true;
      } else {
        libPlayer.onGround = false;
      }
    } else if (dir < 0) {
      const k = Math.ceil(newY / libFloorSpacing);
      const floorY = k * libFloorSpacing;
      if (floorY < libPlayer.y - 0.01 && floorY >= newY && !inGap(k, libPlayer.x)) {
        newY = floorY + libPlayerH;
        libPlayer.vy = 0;
      }
      libPlayer.onGround = false;
    }
    libPlayer.y = newY;

    libCameraY = libPlayer.y - BH * 0.55;

    const doorY = nearestDoorY(libPlayer.y);
    const nearLeftWall = (libPlayer.x - halfW) <= innerLeft + 2;
    if (nearLeftWall && Math.abs((libPlayer.y - libPlayerH / 2) - doorY) <= libPlayerH * 0.7) {
      screen = 'map';
    }

    checkCoinPickup();
  }

  function checkCoinPickup() {
    const k = Math.round(libPlayer.y / libFloorSpacing);
    if (collectedCoinFloors.has(k)) return;
    const coin = coinForFloor(k);
    if (!coin) return;
    const halfW = libPlayerW / 2;
    const coinHalf = Math.max(3, Math.round(libPlayerH * 0.35));
    const playerLeft = libPlayer.x - halfW, playerRight = libPlayer.x + halfW;
    const playerTop = libPlayer.y - libPlayerH, playerBottom = libPlayer.y;
    if (playerRight >= coin.x - coinHalf && playerLeft <= coin.x + coinHalf &&
      playerBottom >= coin.y - coinHalf && playerTop <= coin.y + coinHalf) {
      collectedCoinFloors.add(k);
      bitcoinCount++;
    }
  }

  function drawLibPlayer(cx, feetY) {
    const h = libPlayerH, w = libPlayerW;
    const x = Math.round(cx - w / 2);
    const y = feetY - h;
    bctx.fillStyle = '#f0e8d8';
    bctx.fillRect(x, y, w, Math.max(1, Math.round(h * 0.35)));
    bctx.fillStyle = '#c0392b';
    bctx.fillRect(x, y + Math.round(h * 0.35), w, Math.max(1, Math.round(h * 0.4)));
    const legOff = !libPlayer.onGround ? 0 : (libPlayer.phase ? 1 : -1);
    bctx.fillStyle = '#3a3a3a';
    bctx.fillRect(x + legOff, y + Math.round(h * 0.75), Math.max(1, Math.round(w * 0.4)), Math.round(h * 0.25));
    bctx.fillRect(x + w - Math.round(w * 0.4) - legOff, y + Math.round(h * 0.75), Math.max(1, Math.round(w * 0.4)), Math.round(h * 0.25));
  }

  function drawBitcoinHUD() {
    const size = Math.max(14, Math.round(H * 0.035));
    const pad = size * 0.5;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = `bold ${size}px ${FONT}`;
    const text = `₿ ${bitcoinCount}`;
    const w = ctx.measureText(text).width + pad * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(pad * 0.5, pad * 0.5, w, size + pad);
    ctx.fillStyle = '#f0b90b';
    ctx.fillText(text, pad, pad);
  }

  function drawBookOverlay() {
    // Drawn on the real hi-res canvas (not the low-res pixel-art buffer) so
    // the text stays crisp instead of being blown up into a blurry mess.
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    const bw = W * 0.8, bh = H * 0.7;
    const bx = (W - bw) / 2, by = (H - bh) / 2;
    ctx.fillStyle = '#e8dcc0';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#5a4a30';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const topMargin = bh * 0.1, bottomReserve = bh * 0.16;
    const contentH = bh - topMargin - bottomReserve;
    const fontSize = Math.max(10, Math.round(contentH / (libBookLines.length * 1.3)));
    ctx.font = `bold ${fontSize}px ${FONT}`;
    ctx.fillStyle = '#2a2015';
    libBookLines.forEach((line, i) => {
      ctx.fillText(line.toUpperCase(), W / 2, by + topMargin + i * fontSize * 1.3);
    });

    ctx.font = `bold ${Math.max(9, Math.round(fontSize * 0.7))}px ${FONT}`;
    ctx.fillStyle = '#7a6a4a';
    ctx.fillText('PRESS UP TO CLOSE', W / 2, by + bh - bottomReserve * 0.7);
  }

  function drawUpArrowHint(cx, topY, now) {
    const w = Math.max(3, Math.round(libPlayerW * 0.9));
    const h = Math.max(2, Math.round(w * 0.8));
    const bob = Math.sin(now / 200) * 1.5;
    const y = topY - 2 + bob;
    const alpha = 0.6 + 0.4 * Math.sin(now / 250);
    bctx.fillStyle = `rgba(255,220,90,${alpha.toFixed(2)})`;
    bctx.beginPath();
    bctx.moveTo(cx, y - h);
    bctx.lineTo(cx - w / 2, y);
    bctx.lineTo(cx + w / 2, y);
    bctx.closePath();
    bctx.fill();
  }

  function drawCoin(cx, sy, now) {
    const r = Math.max(2, Math.round(BH * 0.016));
    const bob = Math.sin(now / 300 + cx) * 1;
    const y = sy + bob;
    bctx.fillStyle = '#f0b90b';
    bctx.beginPath();
    bctx.arc(cx, y, r, 0, Math.PI * 2);
    bctx.fill();
    bctx.fillStyle = '#8a5a00';
    bctx.fillRect(Math.round(cx), Math.round(y - r * 0.7), 1, Math.max(1, Math.round(r * 1.4)));
  }

  function drawLibrary(now) {
    bctx.fillStyle = '#161008';
    bctx.fillRect(0, 0, BW, BH);

    const innerLeft = libWallT, innerRight = BW - libWallT;
    const camTop = libCameraY;

    bctx.fillStyle = '#2a2015';
    bctx.fillRect(0, 0, innerLeft, BH);
    bctx.fillRect(innerRight, 0, BW - innerRight, BH);

    const shelfSpacing = 8;
    const firstRow = Math.floor(camTop / shelfSpacing) - 1;
    const lastRow = Math.floor((camTop + BH) / shelfSpacing) + 1;
    for (let r = firstRow; r <= lastRow; r++) {
      const sy = Math.round(r * shelfSpacing - camTop);
      const hL = hash1(r * 3.1 + 0.7);
      const hR = hash1(r * 3.1 + 5.9);
      bctx.fillStyle = `hsl(${Math.floor(hL * 40 + 20)},50%,${30 + hL * 20}%)`;
      bctx.fillRect(2, sy, innerLeft - 4, 3);
      bctx.fillStyle = `hsl(${Math.floor(hR * 40 + 20)},50%,${30 + hR * 20}%)`;
      bctx.fillRect(innerRight + 2, sy, innerLeft - 4, 3);
    }

    const k0 = Math.floor(camTop / libFloorSpacing) - 1;
    const k1 = Math.floor((camTop + BH) / libFloorSpacing) + 1;
    for (let k = k0; k <= k1; k++) {
      const sy = Math.round(k * libFloorSpacing - camTop);
      const { gapX, gapW } = floorGap(k);
      bctx.fillStyle = '#4a3d2a';
      bctx.fillRect(innerLeft, sy, gapX - innerLeft, 3);
      bctx.fillRect(gapX + gapW, sy, innerRight - (gapX + gapW), 3);

      if (!collectedCoinFloors.has(k)) {
        const coin = coinForFloor(k);
        if (coin) drawCoin(coin.x, coin.y - camTop, now);
      }
    }

    const bandI0 = Math.floor(camTop / libDoorBandH) - 1;
    const bandI1 = Math.floor((camTop + BH) / libDoorBandH) + 1;
    for (let i = bandI0; i <= bandI1; i++) {
      const doorY = doorYForBand(i);
      const sy = Math.round(doorY - camTop);
      if (sy < -30 || sy > BH + 30) continue;
      const doorH = libPlayerH * 1.8;
      bctx.fillStyle = '#8a5a2a';
      bctx.fillRect(0, sy - doorH, innerLeft, doorH);
      bctx.fillStyle = '#3a2410';
      bctx.fillRect(0, sy - doorH, innerLeft, 2);
      bctx.fillRect(0, sy - 2, innerLeft, 2);
    }

    const playerScreenFeetY = Math.round(libPlayer.y - camTop);
    drawLibPlayer(libPlayer.x, playerScreenFeetY);

    if (!libReading && libPlayer.onGround && libNearWall()) {
      drawUpArrowHint(libPlayer.x, playerScreenFeetY - libPlayerH, now);
    }
  }

  // ---------------- main loop / resize ----------------
  function resize() {
    const rect = wrap.getBoundingClientRect();
    W = Math.max(200, Math.floor(rect.width));
    H = Math.max(200, Math.floor(rect.height));
    canvas.width = W;
    canvas.height = H;
    BW = Math.max(80, Math.floor(W / PIXEL));
    BH = Math.max(60, Math.floor(H / PIXEL));
    buf.width = BW;
    buf.height = BH;
    bctx.imageSmoothingEnabled = false;
    ctx.imageSmoothingEnabled = false;
    layoutTitle();
    layoutOptions();
    layoutMap();
    layoutLibrary();
  }

  function screenToBuffer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (BW / rect.width),
      y: (clientY - rect.top) * (BH / rect.height),
    };
  }

  canvas.addEventListener('click', (e) => {
    const { x, y } = screenToBuffer(e.clientX, e.clientY);
    if (screen === 'title') hitTitle(x, y);
    else if (screen === 'options') hitOptions(x, y);
    else if (screen === 'map') hitMap(x, y);
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (screen !== 'library') return;
    if (libReading) { libReading = false; return; }
    const { x } = screenToBuffer(e.clientX, e.clientY);
    if (x < BW / 3) libTouch.left = true;
    else if (x > (BW * 2) / 3) libTouch.right = true;
    else if (!tryReadBook()) tryJump();
  });
  window.addEventListener('pointerup', () => { libTouch.left = false; libTouch.right = false; });
  canvas.addEventListener('pointercancel', () => { libTouch.left = false; libTouch.right = false; });

  window.addEventListener('keydown', (e) => {
    if (screen !== 'library') return;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') libKeys.left = true;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') libKeys.right = true;
    else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') && !e.repeat) {
      if (libReading) libReading = false;
      else if (!tryReadBook()) tryJump();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') libKeys.left = false;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') libKeys.right = false;
  });

  let resizeDebounce;
  const ro = new ResizeObserver(() => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(resize, 150);
  });
  ro.observe(wrap);

  function drawScanlines() {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
  }

  function renderFrame(now) {
    if (screen === 'map') updatePlayer(now);
    else if (screen === 'library') updateLibraryPhysics(now);

    if (screen === 'title') drawTitle(now);
    else if (screen === 'options') drawOptions();
    else if (screen === 'map') drawMap(now);
    else if (screen === 'library') drawLibrary(now);

    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(buf, 0, 0, BW, BH, 0, 0, W, H);
    drawScanlines();

    if (screen === 'title') {
      drawTitleTextHiRes(now);
    } else if (screen === 'options') {
      drawOptionsTextHiRes();
    } else if (screen === 'map') {
      drawMapTextHiRes();
      drawBitcoinHUD();
    } else if (screen === 'library') {
      drawBitcoinHUD();
      if (libReading) drawBookOverlay();
    }
  }

  function loop() {
    renderFrame(performance.now());
    requestAnimationFrame(loop);
  }

  resize();
  requestAnimationFrame(loop);
})();
</script>
